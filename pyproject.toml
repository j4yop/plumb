[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah2027"
version = "0.1.0"
description = "Frame-level ball possession for More Than A Hack 2027 (Phase 1)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# Only the official scorer and validator need pandas; the pipeline itself does not.
eval = ["pandas>=2.0,<3"]
dev = ["pytest>=7.4"]

[project.scripts]
mtah = "mtah.run:main"
plumb = "plumb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
